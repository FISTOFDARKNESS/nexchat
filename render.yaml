# Blueprint do Render.com — serviço único (Next.js + WebSocket no mesmo processo).
#
# O server.js (raiz) sobe o Next.js E o servidor WebSocket (/ws) na mesma
# porta, então tudo roda em https://nexchat-xkug.onrender.com — sem subdomínio
# separado. O código do ws-server fica em ws-server/ (usado por server.js).
#
# Env vars necessárias (marque "Apply on each environment"):
#   JWT_SECRET, WS_INTERNAL_SECRET, DATABASE_URL, NEXT_PUBLIC_SUPABASE_URL,
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   NEXT_PUBLIC_GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   NEXT_PUBLIC_RECAPTCHA_SITE_KEY, RECAPTCHA_SECRET_KEY,
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM,
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, NEXT_PUBLIC_VAPID_PUBLIC_KEY

services:
  - type: web
    name: nexchat-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Matchmaking (fila/salas) vive na MEMÓRIA do processo do WebSocket. O
    # load balancer do Render distribui cada conexão WS e cada requisição HTTP
    # em uma instância aleatória, então com >1 instância dois aparelhos caem em
    # instâncias diferentes e nunca se encontram na fila. Fixar em 1 instância
    # garante que WS + estado de matchmaking ficam no mesmo processo.
    # (Para escalar horizontalmente depois, o estado precisa ir para um store
    #  compartilhado — ex.: Postgres/Redis — não apenas memória.)
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: nexchat-web
          type: web
          property: url
      - key: NEXT_PUBLIC_WS_URL
        # Mesmo domínio do app (servidor custom server.js hospeda o WS).
        value: wss://nexchat-xkug.onrender.com
      - key: WS_INTERNAL_URL
        # Loopback no mesmo processo (server.js). Sobrescreva se necessário.
        value: http://localhost:10000
      - key: JWT_SECRET
        sync: false
      - key: WS_INTERNAL_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PREMIUM_PRICE
        value: "39.12"
      - key: PREMIUM_CURRENCY
        value: BRL
      - key: NEXT_PUBLIC_PREMIUM_PRICE
        value: "39.12"
      - key: NEXT_PUBLIC_PREMIUM_CURRENCY
        value: BRL
